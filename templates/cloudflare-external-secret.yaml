{{- if and .Values.cloudflareGateway.enabled .Values.cloudflareGateway.credentials.externalSecret.enabled }}
{{- $credentials := .Values.cloudflareGateway.credentials }}
{{- $external := $credentials.externalSecret }}
{{- $secretName := $credentials.secretName | default (printf "%s-cloudflare-gateway-creds" .Release.Name) }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $secretName | quote }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: {{ $external.storeName | quote }}
    kind: {{ $external.storeKind | quote }}
  target:
    name: {{ $secretName | quote }}
    creationPolicy: Owner
  data:
    - secretKey: CLOUDFLARE_ACCOUNT_ID
      remoteRef:
        key: {{ required "cloudflareGateway.credentials.externalSecret.accountIdKey is required" $external.accountIdKey | quote }}
    - secretKey: CLOUDFLARE_API_TOKEN
      remoteRef:
        key: {{ required "cloudflareGateway.credentials.externalSecret.apiTokenKey is required" $external.apiTokenKey | quote }}
{{- end }}
